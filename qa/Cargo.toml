[workspace]
resolver = "2"

[package]
name = "hybrid-qa"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Phase 6 parity matrix, pure-Rust golden pixel-diff engine, and Windows UIA/SendInput verification harness"

[dependencies]
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["full"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
